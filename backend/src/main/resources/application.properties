spring.application.name=demand-forecasting-inventory

# Active Profile: 'dev' uses built-in H2 in MySQL mode (no MySQL password needed)
# Remove or change to 'prod' when you want to connect to local MySQL server
#spring.profiles.active=dev

# ==============================
# Server Configuration
# ==============================
server.port=8080

# ==============================
# Database Configuration (MySQL)
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/demand_inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Dhaval@1434
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT Configuration
# ==============================
jwt.secret=DemandForecastingInventorySecretKey2026SecureHashKeyMustBe32CharsLong!
jwt.expiration=86400000

# ==============================
# OpenAPI / Swagger
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=WARN
logging.level.com.demandforecast=INFO
